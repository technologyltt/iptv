obd:
  port: /dev/rfcomm0          # ELM327 Bluetooth (ver docs/04 para pairing).
                              # Si usas USB cámbialo a /dev/ttyUSB0
  baudrate: 38400
  timeout: 2.0
  fast: false
  protocol: auto              # ISO 15765-4 CAN (Audi 2009)

dtc:
  # Lectura siempre activa; auto-clear OFF por defecto (el flujo normal es:
  # tras pulsar "ENGAGE" se hace una ráfaga de clears para los códigos VTG).
  auto_clear_enabled: false
  auto_clear_interval_s: 10
  clearable_codes:
    - P2563
    - P0046
    - P132B
    - P003A
  blacklist_codes:
    - P0234
    - P0299
    - P0606
    - P062F
  precondition:
    max_rpm: 1100
    max_speed_kmh: 1
    max_pedal_pct: 5
    stable_window_s: 5

relays:
  # Único relé necesario: corta el +12V del actuador VTG Hella.
  # active_low: módulos de relé chinos típicos. El relé está ON cuando el
  # GPIO está en LOW. ON = VTG con corriente (control normal).
  - {id: 1, gpio: 5, name: "VTG +12V", active_low: true, default: true}

turbo:
  relay_id: 1
  default_state: engaged       # arranca con relé ON (=VTG con corriente)
  engage_settle_s: 3.0         # espera tras dar corriente al actuador
  clear_attempts: 6            # intentos de borrado de DTCs VTG
  clear_interval_s: 1.5
  vtg_codes:
    - P2563
    - P0046
    - P132B
    - P003A

web:
  host: 0.0.0.0
  port: 5000
  poll_interval_s: 0.5

logging:
  dir: ./logs
  level: INFO
