<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d10">
  <title>VTG Bypass · Audi 2.7 TDI</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header>
    <h1>VTG Bypass · 2.7 TDI</h1>
    <span id="conn" class="pill off">desconectado</span>
  </header>

  <main>
    <section class="card big-state">
      <div class="state-line">
        <span class="label">Estado VTG</span>
        <span id="vtg-state" class="state engaged">ENGAGED</span>
      </div>
      <div class="last-action" id="last-action">—</div>
      <div class="row buttons">
        <button id="btn-bypass" class="big red">CORTAR (sonido)</button>
        <button id="btn-engage" class="big green">ACTIVAR TURBO</button>
      </div>
      <p class="hint">"CORTAR" solo funciona con motor parado o idle muy estable.
      "ACTIVAR" devuelve corriente al actuador y borra los DTCs VTG automáticamente.</p>
    </section>

    <section class="card">
      <h2>Estado motor</h2>
      <div class="grid">
        <div class="metric"><span class="label">RPM</span><span class="value" id="rpm">—</span></div>
        <div class="metric"><span class="label">Velocidad</span><span class="value" id="speed">—</span><span class="unit">km/h</span></div>
        <div class="metric"><span class="label">Boost</span><span class="value" id="boost">—</span><span class="unit">bar</span></div>
        <div class="metric"><span class="label">ECT</span><span class="value" id="ect">—</span><span class="unit">°C</span></div>
        <div class="metric"><span class="label">MAF</span><span class="value" id="maf">—</span><span class="unit">g/s</span></div>
        <div class="metric"><span class="label">Pedal</span><span class="value" id="pedal">—</span><span class="unit">%</span></div>
      </div>
    </section>

    <section class="card">
      <h2>Fallos (DTCs)</h2>
      <ul id="dtcs" class="dtcs"><li class="empty">sin fallos</li></ul>
      <div class="row">
        <button id="btn-clear" class="big">Borrar todos los fallos</button>
      </div>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
